<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="./produto.css">
</head>
<body>




    <div class="login-container">

            <!-- Icone para adicionar categoria -->
<div class="add-category-container">
    <button id="add-category-btn" class="add-category-btn">+ Adicionar Categoria</button>
</div>

<!-- Modal para adicionar categoria -->
<div id="add-category-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" id="close-modal-btn">&times;</span>
        <h2>Adicionar Categoria</h2>
        <form id="category-form">
            <div class="form-group">
                <label for="category-name">Nome da Categoria</label>
                <input type="text" id="category-name" name="category-name" placeholder="Digite o nome da categoria" required>
            </div>
            <button type="submit" class="modal-btn">Salvar Categoria</button>
        </form>
    </div>
</div>

<script>
   
</script>




        <h1>Cadastro de Produtos</h1>
        <form id="product-form">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Digite a descrição do produto" required>
            </div>
            <div class="form-group">
                <label for="valor">Valor</label>
                <input type="number" id="valor" name="valor" placeholder="Digite o valor do produto" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="data_vencimento">Data de Vencimento</label>
                <input type="date" id="data_vencimento" name="data_vencimento" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecione uma categoria</option>
                    
                </select>
            </div>
            <button type="submit" class="login-btn">Cadastrar Produto</button>
        </form>
        <h2>Lista de Produtos</h2>
        <table border="1" width="100%" id="product-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Data de Vencimento</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produtos cadastrados serão adicionados aqui -->
            </tbody>
        </table>
<!-- Criar um modal que vai abrir quando eu for atualizar a linha -->
<!-- Modal para atualizar produto -->
<div id="update-product-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" id="close-update-modal-btn">&times;</span>
        <h2>Atualizar Produto</h2>
        <form id="update-product-form">
            <div class="form-group">
                <label for="update-nome">Nome</label>
                <input type="text" id="update-nome" name="update-nome" required>
            </div>
            <div class="form-group">
                <label for="update-descricao">Descrição</label>
                <input type="text" id="update-descricao" name="update-descricao" required>
            </div>
            <div class="form-group">
                <label for="update-valor">Valor</label>
                <input type="number" id="update-valor" name="update-valor" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="update-data_vencimento">Data de Vencimento</label>
                <input type="date" id="update-data_vencimento" name="update-data_vencimento" required>
            </div>
            <div class="form-group">
                <label for="update-categoria">Categoria</label>
                <select id="update-categoria" name="update-categoria" required>
                    <option value="" disabled selected>Selecione uma categoria</option>
                </select>
            </div>
            <button type="submit" class="modal-btn">Salvar Alterações</button>
        </form>
    </div>
</div>


    </div>

   <script src="../js/produtos.js"></script>
</body>
</html>
